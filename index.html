<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Flow</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --safe-area-top: env(safe-area-inset-top, 20px);
            --accent: #6366f1;
            --bg: #fdfdff;
            --card: #ffffff;
            --text: #1e293b;
        }

        body.dark {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: var(--safe-area-top) 20px 100px 20px;
            overscroll-behavior: none; /* Prevents "bounce" on mobile */
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
        }

        h1 { font-size: 32px; font-weight: 800; margin: 0; }

        /* Floating Task List */
        #taskList { margin-top: 10px; }

        .task-card {
            background: var(--card);
            padding: 18px;
            border-radius: 22px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.03);
            animation: slideUp 0.4s cubic-bezier(0.17, 0.67, 0.83, 0.67);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .check-circle {
            width: 28px;
            height: 28px;
            border: 2.5px solid var(--accent);
            border-radius: 50%;
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .done .check-circle { background: var(--accent); }
        .done .task-text { opacity: 0.5; text-decoration: line-through; }

        .task-info { flex: 1; }
        .task-text { font-weight: 600; font-size: 17px; display: block; }
        .task-meta { font-size: 13px; color: #94a3b8; margin-top: 2px; }

        /* Mobile Bottom Input Bar */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card);
            padding: 15px 20px calc(15px + env(safe-area-inset-bottom, 10px)) 20px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.05);
            display: flex;
            gap: 10px;
            border-radius: 30px 30px 0 0;
        }

        .bottom-bar input {
            flex: 1;
            border: none;
            background: var(--bg);
            padding: 15px;
            border-radius: 15px;
            font-size: 16px;
            color: var(--text);
            outline: none;
        }

        .add-fab {
            background: var(--accent);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 15px;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.4);
        }

        .delete-btn { color: #fecaca; margin-left: 10px; font-size: 20px; }
    </style>
</head>
<body>

<header>
    <div id="date-display">
        <span style="color: var(--accent); font-weight: 800; display: block; font-size: 14px; text-transform: uppercase; letter-spacing: 1px;">Ready for today?</span>
        <h1 id="dayName">Monday</h1>
    </div>
    <button onclick="document.body.classList.toggle('dark')" style="background:none; border:none; font-size: 24px;">🌙</button>
</header>

<div id="taskList"></div>

<div class="bottom-bar">
    <input type="text" id="taskInput" placeholder="Add a new task..." autocomplete="off">
    <button class="add-fab" onclick="addTask()">+</button>
</div>

<script>
    let tasks = JSON.parse(localStorage.getItem("mob_flow_tasks")) || [];

    function render() {
        const list = document.getElementById("taskList");
        tasks.sort((a, b) => a.done - b.done || b.id - a.id);
        
        list.innerHTML = tasks.length ? "" : '<div style="text-align:center; margin-top:100px; color:#94a3b8;">No tasks yet. Tap below to add!</div>';

        tasks.forEach(t => {
            const div = document.createElement("div");
            div.className = `task-card ${t.done ? 'done' : ''}`;
            div.innerHTML = `
                <div class="check-circle" onclick="toggleTask(${t.id})">
                    ${t.done ? '<span style="color:white; font-size:14px;">✓</span>' : ''}
                </div>
                <div class="task-info" onclick="toggleTask(${t.id})">
                    <span class="task-text">${t.text}</span>
                    <span class="task-meta">Recently added</span>
                </div>
                <span class="delete-btn" onclick="deleteTask(${t.id})">×</span>
            `;
            list.appendChild(div);
        });
        localStorage.setItem("mob_flow_tasks", JSON.stringify(tasks));
    }

    function addTask() {
        const el = document.getElementById("taskInput");
        if (!el.value.trim()) return;
        tasks.push({ id: Date.now(), text: el.value, done: false });
        el.value = "";
        render();
        window.scrollTo(0,0);
    }

    function toggleTask(id) {
        tasks = tasks.map(t => t.id === id ? {...t, done: !t.done} : t);
        render();
    }

    function deleteTask(id) {
        tasks = tasks.filter(t => t.id !== id);
        render();
    }

    document.getElementById("dayName").innerText = new Date().toLocaleDateString('en-US', { weekday: 'long' });
    render();
</script>
    <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js')
      .then(() => console.log("Service Worker Registered"));
  }
</script>

</body>
</html>
